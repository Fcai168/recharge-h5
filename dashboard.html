<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易捷加油 - 实时数据仪表板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  background: linear-gradient(135deg, #0c1426 0%, #1a2942 100%);
  min-height: 100vh;
  padding: 20px;
  color: #e4e7ec;
}
.container { max-width: 1200px; margin: 0 auto; }
.header {
  text-align: center;
  margin-bottom: 30px;
  padding: 30px 20px;
  background: linear-gradient(135deg, rgba(91,155,213,0.15) 0%, rgba(78,193,193,0.15) 100%);
  border-radius: 16px;
  border: 1px solid rgba(91,155,213,0.3);
}
.header h1 {
  font-size: 28px;
  background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  letter-spacing: 2px;
}
.header .subtitle { color: #8a9aab; font-size: 14px; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 30px;
}
.stat-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
  border: 1px solid rgba(91,155,213,0.2);
  border-radius: 12px;
  padding: 20px;
  backdrop-filter: blur(10px);
}
.stat-card .label { color: #8a9aab; font-size: 12px; margin-bottom: 8px; }
.stat-card .value {
  font-size: 32px;
  font-weight: 700;
  background: linear-gradient(135deg, #5b9bd5 0%, #4ec1c1 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-card.success .value { background: linear-gradient(135deg, #2e9b6e 0%, #4ec98c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.stat-card.danger .value { background: linear-gradient(135deg, #ff5757 0%, #ff8a3d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.section {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(91,155,213,0.2);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
}
.section h2 {
  font-size: 18px;
  color: #fff;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(91,155,213,0.2);
}
table {
  width: 100%;
  max-width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 10px 12px;
  text-align: left;
  font-size: 13px;
  white-space: nowrap;
}
th {
  color: #8a9aab;
  font-weight: 500;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid rgba(91,155,213,0.2);
}
td { color: #e4e7ec; border-bottom: 1px solid rgba(255,255,255,0.05); }
tr:hover td { background: rgba(91,155,213,0.08); }
.status {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
}
.status.success { background: rgba(46,155,110,0.2); color: #4ec98c; }
.status.failed { background: rgba(255,87,87,0.2); color: #ff8a3d; }
.status.processing { background: rgba(91,155,213,0.2); color: #5b9bd5; }
.status.pending { background: rgba(243,152,0,0.2); color: #fbbf24; }
.method { font-size: 11px; color: #8a9aab; }
.amount { color: #fbbf24; font-weight: 600; }
.refresh {
  display: inline-block;
  margin-left: 12px;
  padding: 4px 12px;
  background: linear-gradient(135deg, #5b9bd5 0%, #4ec1c1 100%);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.refresh:active { transform: scale(0.95); }
.last-update { color: #8a9aab; font-size: 12px; margin-top: 20px; text-align: center; }
@media (max-width: 640px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .header h1 { font-size: 22px; }
  th, td { padding: 8px 6px; font-size: 11.5px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; }
  .section { padding: 16px 10px; }
  .container { padding: 10px; }
  body { padding: 10px; }
}
@media (max-width: 360px) {
  .stats-grid { grid-template-columns: 1fr; }
  th, td { padding: 6px 4px; font-size: 10.5px; }
  .stat-card { padding: 14px; }
  .stat-card .value { font-size: 24px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>易捷加油 · 实时数据仪表板</h1>
    <p class="subtitle">Supabase 数据库实时数据 · 移动优先可视化</p>
  </div>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="label">今日订单</div>
      <div class="value" id="todayOrders">-</div>
    </div>
    <div class="stat-card">
      <div class="label">累计订单</div>
      <div class="value" id="totalOrders">-</div>
    </div>
    <div class="stat-card success">
      <div class="label">成功交易额</div>
      <div class="value" id="totalAmount">-</div>
    </div>
    <div class="stat-card danger">
      <div class="label">失败订单</div>
      <div class="value" id="failedOrders">-</div>
    </div>
  </div>

  <div class="section">
    <h2>最近订单 <button class="refresh" onclick="loadAll()">↻ 刷新</button></h2>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>订单号</th>
            <th>手机号</th>
            <th>面额</th>
            <th>实付</th>
            <th>方式</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="ordersTable">
          <tr><td colspan="6" style="text-align:center;color:#8a9aab">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="last-update" id="lastUpdate">最后更新：-</div>
</div>

<script src="js/supabase.js?v=5"></script>
<script>
const STATUS = { success:"成功", failed:"失败", processing:"处理中", pending:"待审" };
const METHOD = { wechat:"微信", alipay:"支付宝" };

async function loadStats() {
  try {
    const data = await dbGetStats();
    if (data) {
      document.getElementById("todayOrders").textContent = data.today_orders || 0;
      document.getElementById("totalOrders").textContent = data.total_orders || 0;
      document.getElementById("totalAmount").textContent = "¥" + Number(data.total_amount || 0).toLocaleString();
      document.getElementById("failedOrders").textContent = data.failed_orders || 0;
    }
  } catch (e) {
    console.error("loadStats error:", e);
  }
}

async function loadOrders() {
  try {
    const orders = await dbListOrders();
    const html = (orders || []).map(o => `
      <tr>
        <td><code style="font-size:11px;color:#8a9aab">${o.id}</code></td>
        <td>${o.phone || '-'}</td>
        <td>¥${o.amount}</td>
        <td><span class="amount">¥${o.actual_pay}</span></td>
        <td><span class="method">${METHOD[o.pay_method] || o.pay_method}</span></td>
        <td><span class="status ${o.status}">${STATUS[o.status] || o.status}</span></td>
      </tr>
    `).join("");
    document.getElementById("ordersTable").innerHTML = html || '<tr><td colspan="6" style="text-align:center;color:#8a9aab">暂无数据</td></tr>';
  } catch (e) {
    console.error("loadOrders error:", e);
    document.getElementById("ordersTable").innerHTML = '<tr><td colspan="6" style="text-align:center;color:#ff8a3d">加载失败</td></tr>';
  }
}

async function loadAll() {
  try {
    await Promise.all([loadStats(), loadOrders()]);
    document.getElementById("lastUpdate").textContent = "最后更新：" + new Date().toLocaleString("zh-CN");
  } catch (e) {
    document.getElementById("lastUpdate").textContent = "加载失败：" + e.message;
  }
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
