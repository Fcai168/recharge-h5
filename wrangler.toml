# =====================================================
# Cloudflare Pages 部署配置
# https://developers.cloudflare.com/pages/
# =====================================================

name = "yijie-recharge"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."
compatibility_flags = ["nodejs_compat"]

# === 环境变量（生产环境） ===
# 在 Cloudflare Dashboard → Settings → Environment variables 添加：
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#
# 或在本文件加：
# [env.production.vars]
# SUPABASE_URL = "https://xxx.supabase.co"
# SUPABASE_ANON_KEY = "eyJ..."

# === 预览环境（可选，每个 PR 自动部署） ===
[env.preview]
name = "yijie-recharge-preview"

# === 自定义域名（在 Dashboard 里配更简单） ===
# routes = [
#   { pattern = "recharge.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]
